[project]
name = "skeleton"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.2,<2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "pydantic>=2",
    "tree-sitter>=0.26.1",
    "tree-sitter-python>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "pytest-cov",
    "ruff",
    "import-linter>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.coverage.run]
branch = true
